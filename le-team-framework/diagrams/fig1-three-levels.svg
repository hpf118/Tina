<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Carlito, Calibri, 'Liberation Sans', sans-serif">
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9E3B3B"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#FFFFFF"/>

  <!-- Band 1 -->
  <rect x="20" y="20" width="760" height="130" rx="6" fill="#DEE5F0" stroke="#1F3864" stroke-width="1.5"/>
  <rect x="20" y="20" width="210" height="130" rx="6" fill="#1F3864"/>
  <text x="125" y="72" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">L1 · DIRECTION</text>
  <text x="125" y="98" fill="#FFFFFF" font-size="16" text-anchor="middle">EDS 03 · Team Lead</text>
  <text x="250" y="52" fill="#1F3864" font-size="20" font-weight="700">Owns the problem and the direction</text>
  <text x="250" y="80" fill="#333333" font-size="16"><tspan font-weight="700">Is given:</tspan> an open need or opportunity</text>
  <text x="250" y="104" fill="#333333" font-size="16"><tspan font-weight="700">Produces:</tspan> Capability Charter · standards · SOPs · decisions</text>
  <text x="250" y="128" fill="#333333" font-size="16"><tspan font-weight="700">Horizon:</tspan> 1–2 years</text>

  <!-- gap 1 arrows -->
  <line x1="300" y1="152" x2="300" y2="206" stroke="#1F3864" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="314" y="184" fill="#1F3864" font-size="15" font-weight="700">framed problem + success measures</text>
  <line x1="600" y1="208" x2="600" y2="154" stroke="#9E3B3B" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="614" y="184" fill="#9E3B3B" font-size="15" font-weight="700">impact · lessons learned</text>

  <!-- Band 2 -->
  <rect x="20" y="210" width="760" height="130" rx="6" fill="#E6ECF3" stroke="#5B7699" stroke-width="1.5"/>
  <rect x="20" y="210" width="210" height="130" rx="6" fill="#5B7699"/>
  <text x="125" y="262" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">L2 · ARCHITECTURE</text>
  <text x="125" y="288" fill="#FFFFFF" font-size="16" text-anchor="middle">EDS 02 · Digital</text>
  <text x="125" y="308" fill="#FFFFFF" font-size="16" text-anchor="middle">Learning Specialist</text>
  <text x="250" y="242" fill="#1F3864" font-size="20" font-weight="700">Owns the solution system of a product line</text>
  <text x="250" y="270" fill="#333333" font-size="16"><tspan font-weight="700">Is given:</tspan> a framed problem and its constraints</text>
  <text x="250" y="294" fill="#333333" font-size="16"><tspan font-weight="700">Produces:</tspan> Solution Blueprint · pattern pack · golden sample · specs</text>
  <text x="250" y="318" fill="#333333" font-size="16"><tspan font-weight="700">Horizon:</tspan> 3–12 months</text>

  <!-- gap 2 arrows -->
  <line x1="300" y1="342" x2="300" y2="396" stroke="#1F3864" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="314" y="374" fill="#1F3864" font-size="15" font-weight="700">blueprint + pattern pack + golden sample</text>
  <line x1="600" y1="398" x2="600" y2="344" stroke="#9E3B3B" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="614" y="374" fill="#9E3B3B" font-size="15" font-weight="700">pattern gaps · build issues</text>

  <!-- Band 3 -->
  <rect x="20" y="400" width="760" height="130" rx="6" fill="#F4F6F9" stroke="#8A9BB3" stroke-width="1.5"/>
  <rect x="20" y="400" width="210" height="130" rx="6" fill="#8A9BB3"/>
  <text x="125" y="452" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">L3 · INSTANCE</text>
  <text x="125" y="478" fill="#FFFFFF" font-size="16" text-anchor="middle">EDS 01 · Instructional</text>
  <text x="125" y="498" fill="#FFFFFF" font-size="16" text-anchor="middle">Designer</text>
  <text x="250" y="432" fill="#1F3864" font-size="20" font-weight="700">Owns each course, module and item</text>
  <text x="250" y="460" fill="#333333" font-size="16"><tspan font-weight="700">Is given:</tspan> a blueprint or pattern, sources and SMEs</text>
  <text x="250" y="484" fill="#333333" font-size="16"><tspan font-weight="700">Produces:</tspan> course/module HLD · storyboards · assessment tools · builds</text>
  <text x="250" y="508" fill="#333333" font-size="16"><tspan font-weight="700">Horizon:</tspan> weeks to 3 months</text>

  <!-- Rule of thumb box -->
  <rect x="820" y="20" width="260" height="320" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="840" y="52" fill="#1F3864" font-size="18" font-weight="700">Who decides</text>
  <text x="840" y="88" fill="#1F3864" font-size="16" font-weight="700">Team Lead</text>
  <text x="840" y="108" fill="#333333" font-size="16">why, and which approach</text>
  <text x="840" y="144" fill="#5B7699" font-size="16" font-weight="700">EDS 02</text>
  <text x="840" y="164" fill="#333333" font-size="16">how it works, and what</text>
  <text x="840" y="184" fill="#333333" font-size="16">good looks like</text>
  <text x="840" y="220" fill="#6B7F99" font-size="16" font-weight="700">EDS 01</text>
  <text x="840" y="240" fill="#333333" font-size="16">what goes in, and makes it</text>
  <text x="840" y="276" fill="#9E3B3B" font-size="16" font-weight="700">TDO</text>
  <text x="840" y="296" fill="#333333" font-size="16">when, and who (EDS 01)</text>

  <!-- TDO box -->
  <line x1="780" y1="465" x2="820" y2="465" stroke="#9E3B3B" stroke-width="2.5"/>
  <rect x="820" y="400" width="260" height="130" rx="6" fill="#F1E5E5" stroke="#9E3B3B" stroke-width="1.5"/>
  <text x="840" y="432" fill="#9E3B3B" font-size="18" font-weight="700">TDO · Capt / Lt(N)</text>
  <text x="840" y="458" fill="#333333" font-size="16">Line manager of the EDS 01s</text>
  <text x="840" y="484" fill="#333333" font-size="16">Assignments · schedule ·</text>
  <text x="840" y="504" fill="#333333" font-size="16">workload</text>
</svg>
